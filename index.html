<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Work Schedule</title>
    </head>


    <body>
        <div class="app">

            <!-- HEADER -->

            <div class="header">

                <button
                    class="month-button"
                    onclick="previousMonth()">
                    ◀
                </button>

                <div
                    class="month-title"
                    id="monthTitle">
                </div>

                <button
                    class="month-button"
                    onclick="nextMonth()">
                    ▶
                </button>

            </div>


            <!-- WEEKDAYS -->

            <div class="weekdays">

                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
                <div class="weekday">Sun</div>

            </div>


            <!-- CALENDAR -->

            <div
                class="calendar"
                id="calendar">
            </div>


            <!-- FOOTER -->

            <div class="footer">

                <div class="person-card">

                    <div class="person-name">
                        Erikas
                    </div>

                    <div class="stats">

                        <div class="stat">

                            <div class="stat-title">
                                Hours
                            </div>

                            <div
                                class="stat-value"
                                id="myHours">
                                0h
                            </div>

                        </div>

                        <div class="stat">

                            <div class="stat-title">
                                Gross
                            </div>

                            <div
                                class="stat-value"
                                id="myGross">
                                €0.00
                            </div>

                        </div>

                        <div class="stat">

                            <div class="stat-title">
                                Net
                            </div>

                            <div
                                class="stat-value"
                                id="myNet">
                                €0.00
                            </div>

                        </div>

                    </div>

                </div>


                <div class="person-card">

                    <div class="person-name">
                        Ernesta
                    </div>

                    <div class="stats">

                        <div class="stat">

                            <div class="stat-title">
                                Hours
                            </div>

                            <div
                                class="stat-value"
                                id="gfHours">
                                0h
                            </div>

                        </div>

                        <div class="stat">

                            <div class="stat-title">
                                Gross
                            </div>

                            <div
                                class="stat-value"
                                id="gfGross">
                                €0.00
                            </div>

                        </div>

                        <div class="stat">

                            <div class="stat-title">
                                Net
                            </div>

                            <div
                                class="stat-value"
                                id="gfNet">
                                €0.00
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div
            class="modal-background"
            id="modalBackground">

            <div class="modal">

                <h2
                    class="modal-title"
                    id="modalTitle">
                </h2>


                <!-- ERIKAS -->

                <div class="person-row">

                    <div class="person-name-modal">
                        Erikas
                    </div>

                    <div class="time-row">

                        <select id="erikasStart"></select>

                        <span>-</span>

                        <select id="erikasEnd"></select>

                    </div>

                    <label class="day-off-label">

                        <input
                            type="checkbox"
                            id="erikasOff"
                            onchange="togglePerson('erikas')">

                        Day Off

                    </label>

                </div>


                <!-- GIRLFRIEND -->

                <div class="person-row">

                    <div class="person-name-modal">
                        Girlfriend
                    </div>

                    <div class="time-row">

                        <select id="gfStart"></select>

                        <span>-</span>

                        <select id="gfEnd"></select>

                    </div>

                    <label class="day-off-label">

                        <input
                            type="checkbox"
                            id="gfOff"
                            onchange="togglePerson('gf')">

                        Day Off

                    </label>

                </div>


                <!-- BUTTONS -->

                <div class="modal-buttons">

                    <button
                        class="modal-button cancel"
                        onclick="closeModal()">
                        Cancel
                    </button>

                    <button
                        class="modal-button save"
                        onclick="saveDay()">
                        Save
                    </button>

                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="script.js"></script>
    </body>
</html>
